# Investo backend stack for the Oracle Cloud (Ampere A1) instance.
# Dashboard is NOT here — it deploys to Vercel and points at this box's
# public https/wss endpoints (Caddy runs as a separate container, outside this compose file).
#
# Database is Neon (managed Postgres/TimescaleDB) — no local DB container.
# Only Redis is self-hosted here (engine polls it in a tight loop so it
# must stay on localhost-latency next to the engine).
#
# Resource budget is sized for Always Free Ampere A1 = 2 OCPU / 12 GB RAM.
# mem_limit = hard cap (container killed if exceeded), mem_reservation = the
# soft floor the scheduler guarantees. NODE_OPTIONS caps the V8 heap under
# each mem_limit so Node self-GCs instead of getting OOM-killed by the kernel.

x-node-app: &node-app
  build:
    context: .
    dockerfile: Dockerfile
  image: investo-backend:latest
  restart: unless-stopped
  env_file: .env
  depends_on:
    redis:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    container_name: investo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    cpus: 0.50
    mem_limit: 640m
    mem_reservation: 128m

  # ---- Node services (shared image) ----

  api:
    <<: *node-app
    container_name: investo-api
    working_dir: /app/apps/api
    command: ["tsx", "src/index.ts"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "8000:8000"
    cpus: 0.50
    mem_limit: 768m
    mem_reservation: 256m

  engine:
    <<: *node-app
    container_name: investo-engine
    working_dir: /app/apps/engine
    command: ["tsx", "src/index.ts"]
    environment:
      WITH_SNAPSHOT: "true"
      NODE_OPTIONS: "--max-old-space-size=1536"
      SNAPSHOT_DIR: "/data/snapshot"
    volumes:
      - engine-snapshot:/data/snapshot
    cpus: 0.75
    mem_limit: 2g
    mem_reservation: 512m

  ws:
    <<: *node-app
    container_name: investo-ws
    working_dir: /app/apps/ws
    command: ["tsx", "src/index.ts"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "5001:5001"
    cpus: 0.50
    mem_limit: 768m
    mem_reservation: 256m

  mm:
    <<: *node-app
    container_name: investo-mm
    working_dir: /app/apps/mm
    command: ["tsx", "src/index.ts"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
    cpus: 0.40
    mem_limit: 512m
    mem_reservation: 192m

  db:
    <<: *node-app
    container_name: investo-db
    working_dir: /app/apps/db
    command: ["tsx", "src/index.ts"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    cpus: 0.50
    mem_limit: 768m
    mem_reservation: 256m
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.rotate-trades.schedule: "0 30 0 * * *"
      ofelia.job-exec.rotate-trades.command: "sh -c 'cd /app/apps/db && tsx src/rotate-trades.ts'"

  # ---- Cron scheduler ----
  cron:
    image: mcuadros/ofelia:latest
    container_name: investo-cron
    restart: unless-stopped
    depends_on:
      - db
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cpus: 0.10
    mem_limit: 64m

volumes:
  redis-data:
  engine-snapshot:
